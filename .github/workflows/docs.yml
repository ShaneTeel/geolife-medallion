name: Deploy Docs
on:
  push:
    branches:
      - main
  workflow_dispatch:   # lets you start a fresh docs deploy from the Actions tab ("Run workflow")

# One Pages deploy at a time; a newer push waits instead of racing the older one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install zensical "mkdocstrings[python]"
          # If mkdocstrings needs your package's dependencies to import modules, install your package too:
          # pip install -e .

      - name: Build documentation
        run: zensical build

      # The artifact name includes the attempt number: a re-run reuses the same workflow run,
      # and the first attempt's artifact is still there, so a fixed name would be found twice.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
