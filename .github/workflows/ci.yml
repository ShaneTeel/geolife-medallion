name: CI

# Pull requests: lint, type-check, offline tests, bundle validation.
# Push to main: the same checks, then deploy to prod with deploy.sh (the same script used locally).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its run still in progress.
# Runs on main are never cancelled, so a deploy is never interrupted halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, type-check, offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip   # dependency groups need pip >= 25.1
          pip install -e . --group test "ruff>=0.17.5" "mypy>=1.10"

      - name: Lint
        run: ruff check src tests

      - name: Type-check
        run: mypy

      - name: Offline tests
        run: pytest   # Databricks tests are skipped without --databricks

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/

  bundle:
    name: Validate bundle
    runs-on: ubuntu-latest
    env:
      # Repository secret (Settings -> Secrets and variables -> Actions).
      # The workspace host comes from databricks.yml.
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Validate dev and prod targets
        run: |
          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::warning::DATABRICKS_TOKEN secret is not set; skipping bundle validation."
            exit 0
          fi
          databricks bundle validate -t dev
          databricks bundle validate -t prod

  deploy:
    name: Deploy to prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, bundle]
    runs-on: ubuntu-latest
    # Optional: add required reviewers to the "production" environment
    # (Settings -> Environments) to approve each prod deploy by hand.
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5   # deploy.sh uses python to print the signed-in user
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6     # databricks.yml builds the wheel with `uv build`

      - uses: databricks/setup-cli@main

      - name: Deploy with deploy.sh
        run: |
          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::warning::DATABRICKS_TOKEN secret is not set; skipping deploy."
            exit 0
          fi
          # Tests already passed in the checks job.
          bash deploy.sh prod --allow-prod --skip-tests
