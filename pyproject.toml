[project]
name = "geolife-medallion"
version = "0.0.1"
authors = [{ name = "Shane Teel", email = "shane.teel@caci.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
    "shapely==2.1.2",
    "geopy==2.4.1",
]

[project.optional-dependencies]
viz = [
    "plotly==6.7.0",
    "calplot==0.1.7.5",
    "folium==0.20.0",
    "networkx==3.6.1",
]

[dependency-groups]
# from databricks base image (mirror the deps + versions used in databricks for local dev)
mirror = [
    "numpy==2.3.4",
    "pandas==2.3.3",
    "scikit-learn==1.7.2"
]

test = [
    { include-group = "mirror" },
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",                   # smoke tests parse resources/*.yml
    "databricks-connect>=19.1,<19.2"
]

docs = [
    "zensical==0.1.1",               # site theme
    "mkdocstrings[python]>=0.25",    # pull docstrings into the docs
]

dev = [
    { include-group = "mirror" },
    { include-group = "docs" },
    { include-group = "test" },
    "ruff>=0.17.5",
    "mypy>=1.10",
    "databricks-dlt==0.3.0",
    "ipykernel>=7.4.0"
]

[project.scripts]
geolife-bronze = "geolife_medallion.jobs.bronze:main"
geolife-silver = "geolife_medallion.jobs.silver:main"
geolife-gold   = "geolife_medallion.jobs.gold:main"
sql-objects = "geolife_medallion.jobs.sql_objects:main"

# ---------------------------------------------------------------------------
# Tests: pytest + coverage, with all outputs written under reports/
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=geolife_medallion",
    "--cov-report=term-missing",                       # summary in the terminal
    "--cov-report=html:reports/coverage/html",         # browsable report
    "--cov-report=xml:reports/coverage/coverage.xml",  # for CI tools
    "--junitxml=reports/tests/junit.xml",              # test results for CI tools
]
markers = [
    "databricks: tests that call real Databricks via Databricks Connect",
]

[tool.coverage.run]
source = ["geolife_medallion"]
branch = true
data_file = "reports/coverage/.coverage"

[tool.coverage.report]
show_missing = true
skip_empty = true
# Lines that only run when a module is executed directly (`python -m ...`) aren't worth
# testing; the jobs are covered by their entry points and the dev run instead.
exclude_also = [
    'if __name__ == "__main__":'
]

# ---------------------------------------------------------------------------
# Code quality
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errors, I: import sorting, B: likely bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# __init__.py files re-export the package's public API; those imports are intentional.
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geolife_medallion"]