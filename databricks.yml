# This is a Declarative Automation Bundle definition for geolife_medallion.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: geolife_medallion
  uuid: 19132a25-2ff0-4bd6-8e75-8440e3fd95f6

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-af7ec3b2-548f.cloud.databricks.com?w=7474658670272190
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-af7ec3b2-548f.cloud.databricks.com?w=7474658670272190
      # Deploy under the deploying identity's folder so there is a single prod copy.
      # When CI deploys as a service principal, this resolves to the service principal.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    # The prod schema is created by resources/schemas.yml.